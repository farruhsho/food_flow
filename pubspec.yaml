name: food_flow
description: FoodFlow Restaurant Management System - Modern Edition 2025
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - Core packages
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.5
  firebase_storage: ^12.3.8
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  provider: ^6.1.2

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1

  # Localization
  flutter_localizations:
    sdk: flutter

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Image Processing
  image_picker: ^1.1.2
  flutter_cache_manager: ^3.4.1

  # Network & Connectivity
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  dio: ^5.7.0

  # Authentication
  google_sign_in: ^6.2.2

  # Date & Time
  intl: ^0.20.2

  # Charts & Analytics
  fl_chart: ^0.69.0

  # Maps & Location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^6.0.2

  # Storage & Cache
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Payment Systems
  webview_flutter: ^4.10.0
  app_links: ^6.3.2
  crypto: ^3.0.6

  # Security
  local_auth: ^2.3.0

  # Utils
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  logger: ^2.4.0
  uuid: ^4.5.1

  # Social & Sharing
  share_plus: ^10.1.0
  in_app_review: ^2.0.10

  # Notifications
  flutter_local_notifications: ^19.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

